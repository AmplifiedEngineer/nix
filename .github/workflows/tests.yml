name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the flake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Check the flake
        run: nix flake check --all-systems --no-build

      - name: Build and run both packages
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix | head -n 1)"
          for name in playbook pbtop; do
            out="$(nix build ".#$name" --no-link --print-out-paths)"
            got="$("$out/bin/$name" --version)"
            [ "${got##* }" = "$version" ] \
              || { echo "::error::$name says '$got', not $version." >&2; exit 1; }
            echo "$name: $got"
          done
