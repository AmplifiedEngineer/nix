name: CLA & DCO

# Calls the shared checks in dco-cla.yml and the signing job in cla-sign.yml.
# Other repos copy this file and call
# `amplifiedengineer/.github/.github/workflows/<name>.yml@<commit>` instead of
# the local paths. Pin the commit and bump it when the shared workflows change. The job id must stay `cla-dco` so the required checks read
# `cla-dco / dco` and `cla-dco / cla-check` in every repo.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla-dco:
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: read
    uses: amplifiedengineer/.github/.github/workflows/dco-cla.yml@181e6d04c259727b9a7ae44e66cbfb2f52e99292 # main

  cla-sign:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: write
      pull-requests: write
    uses: amplifiedengineer/.github/.github/workflows/cla-sign.yml@181e6d04c259727b9a7ae44e66cbfb2f52e99292 # main
